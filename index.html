<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品详情 - 设计作品集</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 导航栏 -->
  <header class="header">
    <div class="nav">
      <a href="index.html" class="logo">作品集</a>
      <ul class="menu">
        <li><a href="index.html">首页</a></li>
        <li><a href="portfolio.html">作品集</a></li>
        <li><a href="about.html">关于我</a></li>
        <li><a href="contact.html">联系我</a></li>
      </ul>
    </div>
  </header>

  <!-- 作品详情核心区域（唯一结构，无重复ID） -->
  <main class="work-detail-main">
    <section class="work-detail-section">
      <h1 id="productTitle">作品详情</h1>
      
      <!-- 动态图片画廊 -->
      <div class="gallery-container">
        <button id="prevBtn">←</button>
        <img id="tbMainImg" src="" alt="作品主图">
        <button id="nextBtn">→</button>
      </div>
      <div class="thumbnail-list"></div>

      <div class="work-info">
        <p>设计师：个人设计工作室</p>
        <p>设计类型：电商产品视觉设计</p>
        <p>工具：PS / C4D / Blender</p>
      </div>
    </section>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <p>© 2025 个人设计作品集 | 版权所有</p>
  </footer>

  <!-- 核心JS：动态加载作品 + 图片切换 -->
  <script>
    // 1. 定义所有作品的图片路径（可自行扩展）
    const productGallery = {
      "electric-toothbrush": {
        title: "电动牙刷 - 亚马逊图片设计",
        images: [
          "images/dd-yashua/DDYS-1.jpg",
          "images/dd-yashua/DDYS-2 (1).jpg",
          "images/dd-yashua/DDYS-2 (2).jpg",
          "images/dd-yashua/DDYS-2 (3).jpg",
          "images/dd-yashua/DDYS-2 (4).jpg",
          "images/dd-yashua/DDYS-2 (5).jpg",
          "images/dd-yashua/DDYS-2 (6).jpg"
        ]
      },
      "charger": {
        title: "充电器 - 三维渲染设计",
        images: [
          "images/chongdianqiXR/CDQ-1.jpg",
          "images/chongdianqiXR/CDQ-2 (1).jpg",
          "images/chongdianqiXR/CDQ-2 (2).jpg",
          "images/chongdianqiXR/CDQ-2 (3).jpg",
          "images/chongdianqiXR/CDQ-2 (4).jpg",
          "images/chongdianqiXR/CDQ-2 (5).jpg",
          "images/chongdianqiXR/CDQ-2 (6).jpg"
        ]
      },
      "color-light": {
        title: "彩灯 - 产品视觉设计",
        images: [
          "images/Caideng/CD-1.jpg",
          "images/Caideng/CD-2 (1).jpg",
          "images/Caideng/CD-2 (2).jpg",
          "images/Caideng/CD-2 (3).jpg",
          "images/Caideng/CD-2 (4).jpg",
          "images/Caideng/CD-2 (5).jpg",
          "images/Caideng/CD-2 (6).jpg",
          "images/Caideng/CD-2 (7).jpg"
        ]
      }
    };

    // 2. 获取URL参数（判断跳转的是哪个作品）
    function getProductParam() {
      const params = new URLSearchParams(window.location.search);
      return params.get("product") || "electric-toothbrush";
    }

    // 3. 初始化页面
    document.addEventListener("DOMContentLoaded", function() {
      const currentProduct = getProductParam();
      const productData = productGallery[currentProduct];
      const imgList = productData.images;
      let currentIndex = 0;

      // 绑定DOM元素
      const mainImg = document.getElementById("tbMainImg");
      const thumbContainer = document.querySelector(".thumbnail-list");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const titleEl = document.getElementById("productTitle");

      // 设置作品标题
      titleEl.textContent = productData.title;
      // 初始化主图
      mainImg.src = imgList[0];

      // 4. 动态生成缩略图
      imgList.forEach((src, index) => {
        const thumb = document.createElement("img");
        thumb.src = src;
        thumb.classList.add("thumbnail");
        thumb.dataset.index = index;
        // 缩略图点击事件
        thumb.addEventListener("click", () => {
          currentIndex = index;
          mainImg.src = src;
          updateActiveThumb();
        });
        thumbContainer.appendChild(thumb);
      });

      // 5. 更新缩略图选中状态
      function updateActiveThumb() {
        document.querySelectorAll(".thumbnail").forEach((thumb, i) => {
          thumb.classList.toggle("active", i === currentIndex);
        });
      }
      updateActiveThumb();

      // 6. 左右切换按钮
      prevBtn.addEventListener("click", () => {
        currentIndex = (currentIndex - 1 + imgList.length) % imgList.length;
        mainImg.src = imgList[currentIndex];
        updateActiveThumb();
      });

      nextBtn.addEventListener("click", () => {
        currentIndex = (currentIndex + 1) % imgList.length;
        mainImg.src = imgList[currentIndex];
        updateActiveThumb();
      });
    });
  </script>
</body>
</html>
