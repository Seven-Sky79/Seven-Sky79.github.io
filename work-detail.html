  <style>
    /* 全局灯箱样式 */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.92);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    .lightbox-img {
      max-width: 90%;
      max-height: 90vh;
      object-fit: contain;
    }
    /* 左右切换按钮 */
    .lightbox-prev,
    .lightbox-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 50px;
      line-height: 50px;
      text-align: center;
      font-size: 30px;
      color: #fff;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      cursor: pointer;
      user-select: none;
    }
    .lightbox-prev { left: 30px; }
    .lightbox-next { right: 30px; }
    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 36px;
      color: #fff;
      cursor: pointer;
      user-select: none;
    }
    .tb-main img,
    .tb-thumb img {
      cursor: zoom-in;
    }
    <span style="background-color: #ffff99;">/* 默认隐藏所有产品画廊，只显示当前产品 */
    .tb-gallery {
      display: none !important;
    }</span>
  </style>
</head>

      <a href="portfolio.html" class="btn btn-outline">← 返回作品集</a>
    </div>
  </div>
</section>
<!-- 全屏放大灯箱 + 左右翻页 -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-close" onclick="closeLightbox()">×</div>
  <div class="lightbox-prev" onclick="prevImg()">←</div>
  <img class="lightbox-img" id="lightboxImg" src="">
  <div class="lightbox-next" onclick="nextImg()">→</div>
</div>
<!-- 页脚 -->
<footer class="footer">
  <div class="container">
    <p>© 2026 YUAN PENG · 电商设计师</p>
  </div>
</footer>
  
<!-- 修复后的交互JS -->
<script>
<span style="background-color: #ffff99;">// 1. 读取URL参数并严格匹配产品
const urlParams = new URLSearchParams(window.location.search);
const currentProduct = urlParams.get('product');
  
// 2. 强制隐藏所有画廊，再显示当前产品的画廊
document.querySelectorAll('.tb-gallery').forEach(gallery => {
  gallery.style.display = 'none';
});

const currentGallery = document.querySelector(`.tb-gallery[data-product="${currentProduct}"]`);
if (currentGallery) {
  currentGallery.style.display = 'block';
}
  
// 3. 只收集当前产品的图片，避免灯箱出现其他产品
const imgList = [];
if (currentGallery) {
  currentGallery.querySelectorAll('.tb-thumb img').forEach(img => {
    if (!imgList.includes(img.src)) {
      imgList.push(img.src);
    }
  });
}

// 4. 修复：获取当前产品的主图（用类选择器，避免ID重复）
let mainImg = currentGallery.querySelector('.tb-main-img');
let currentIndex = 0;</span>
  
// 切换主图
function switchImg(el){
  if (!mainImg) return;
  mainImg.src = el.src;
  document.querySelectorAll('.tb-thumb img').forEach(item=>{
    item.classList.remove('active');
  })
  el.classList.add('active');
  // 更新当前索引
  currentIndex = imgList.indexOf(el.src);
}
  
// 打开灯箱
function openLightboxByUrl(url){
  currentIndex = imgList.indexOf(url);
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').style.display = 'flex';
}
  
// 灯箱翻页（仅当前产品图片）
function prevImg(){
  currentIndex--;
  if(currentIndex < 0) currentIndex = imgList.length - 1;
  document.getElementById('lightboxImg').src = imgList[currentIndex];
}
function nextImg(){
  currentIndex++;
  if(currentIndex >= imgList.length) currentIndex = 0;
  document.getElementById('lightboxImg').src = imgList[currentIndex];
}
function closeLightbox(){
  document.getElementById('lightbox').style.display = 'none';
}
  
// 键盘控制
document.addEventListener('keydown',function(e){
  if(e.key === 'ArrowLeft') prevImg();
  if(e.key === 'ArrowRight') nextImg();
  if(e.key === 'Escape') closeLightbox();
});
  
// 汉堡菜单
const hamburger = document.querySelector('.hamburger');
const navMenu = document.querySelector('.nav-menu');
hamburger.addEventListener('click', () => {
  navMenu.classList.toggle('active');
  hamburger.textContent = navMenu.classList.contains('active') ? '✕' : '☰';
});
document.querySelectorAll('.nav-menu a').forEach(link => {
  link.addEventListener('click', () => {
    navMenu.classList.remove('active');
    hamburger.textContent = '☰';
  });
});
</script>
</body>
</html>
