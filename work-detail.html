  <style>
    /* 全局灯箱样式 */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.92);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    .lightbox-img {
      max-width: 90%;
      max-height: 90vh;
      object-fit: contain;
    }
    /* 左右切换按钮 */
    .lightbox-prev,
    .lightbox-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 50px;
      line-height: 50px;
      text-align: center;
      font-size: 30px;
      color: #fff;
      background: rgba(255,255,0.15);
      border-radius: 50%;
      cursor: pointer;
      user-select: none;
    }
    .lightbox-prev { left: 30px; }
    .lightbox-next { right: 30px; }
    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 36px;
      color: #fff;
      cursor: pointer;
      user-select: none;
    }
    .tb-main img,
    .tb-thumb img {
      cursor: zoom-in;
    }
    /* 默认隐藏所有产品画廊 */
    .tb-gallery {
      display: none;
    }
  </style>
</head>

document.querySelectorAll('.tb-gallery').forEach(gallery => {
  gallery.style.display = 'none';
});
const currentGallery = document.querySelector(`.tb-gallery[data-product="${currentProduct}"]`);
if(currentGallery){
  currentGallery.style.display = 'block';
}

// 只收集当前产品缩略图，杜绝其他产品混入
const imgList = [];
if(currentGallery){
  currentGallery.querySelectorAll('.tb-thumb img').forEach(img => {
    if(!imgList.includes(img.src)) imgList.push(img.src);
  });
}

// 获取当前产品主图（用class，不再用重复id）
let mainImg = currentGallery ? currentGallery.querySelector('.tb-main-img') : null;
let currentIndex = 0;

// 切换缩略图
function switchImg(el){
  if(!mainImg) return;
  mainImg.src = el.src;
  document.querySelectorAll('.tb-thumb img').forEach(item=>item.classList.remove('active'));
  el.classList.add('active');
  currentIndex = imgList.indexOf(el.src);
}

// 灯箱相关
function openLightboxByUrl(url){
  currentIndex = imgList.indexOf(url);
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').style.display = 'flex';
}
function prevImg(){
  currentIndex--;
  if(currentIndex < 0) currentIndex = imgList.length - 1;
  document.getElementById('lightboxImg').src = imgList[currentIndex];
}
function nextImg(){
  currentIndex++;
  if(currentIndex >= imgList.length) currentIndex = 0;
  document.getElementById('lightboxImg').src = imgList[currentIndex];
}
function closeLightbox(){
  document.getElementById('lightbox').style.display = 'none';
}

// 键盘翻页
document.addEventListener('keydown',function(e){
  if(e.key === 'ArrowLeft') prevImg();
  if(e.key === 'ArrowRight') nextImg();
  if(e.key === 'Escape') closeLightbox();
});

// 汉堡菜单
const hamburger = document.querySelector('.hamburger');
const navMenu = document.querySelector('.nav-menu');
hamburger.addEventListener('click', () => {
  navMenu.classList.toggle('active');
  hamburger.textContent = navMenu.classList.contains('active') ? '✕' : '☰';
});
document.querySelectorAll('.nav-menu a').forEach(link => {
  link.addEventListener('click', () => {
    navMenu.classList.remove('active');
    hamburger.textContent = '☰';
  });
});
</script>
</body>
</html>
